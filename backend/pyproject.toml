[project]
name = "fairhire"
version = "0.1.0"
description = "FairHire — Deterministic Resume–JD matching with NER-style parsing"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "nltk>=3.10.3",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "a2wsgi>=1.10.10",
]

[project.optional-dependencies]
# Audit pipeline and analysis scripts; the API doesn't import these.
research = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
