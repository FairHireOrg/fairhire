[project]
name = "fairhire"
version = "0.1.0"
description = "FairHire AI — Bias audit platform for AI-based resume screening"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openai>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
